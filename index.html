<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>謝佳杰的裁判養成之路</title>

    <!-- iOS 加入主畫面圖標 (維持原圖) -->
    <link rel="apple-touch-icon" href="icon_exercise.png">
    
    <!-- 一般網頁 Favicon (使用動態 Canvas 裁切為圓形) -->
    <link id="dynamic-favicon" rel="icon" type="image/png" href="icon_exercise.png">

    <!-- Web App Manifest (支援加入主畫面與 PWA 應用) -->
    <link rel="manifest" id="manifest-placeholder">

    <style>
        :root {
            --primary-color: #4CAF50;
            --secondary-color: #2196F3;
            --accent-color: #FF5722;
            --danger-color: #e74c3c;
            --bg-color: #f5f5f5;
            --card-bg: #ffffff;
            --text-color: #333333;
            --purple-color: #9b59b6;
            --warning-color: #f1c40f;
        }

        * { 
            box-sizing: border-box; 
            touch-action: manipulation;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.5;
            margin: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            position: relative;
        }

        .container { width: 100%; max-width: 700px; position: relative; }

        /* 頂部功能區：電腦與手機均不互相干擾壓字 */
        .top-navbar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            width: 100%;
            margin-bottom: 8px;
        }
        .top-action-bar {
            display: flex;
            gap: 8px;
        }
        .top-btn {
            background: #ffffff;
            border: 1.5px solid var(--secondary-color);
            color: var(--secondary-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .top-btn.task-btn {
            border-color: #e67e22;
            color: #d35400;
        }
        .top-btn:hover {
            background-color: #f0f7ff;
        }
        .top-btn:active {
            transform: scale(0.96);
        }

        /* 主標題完全獨立排版 */
        h1.main-title {
            text-align: center;
            color: #2c3e50;
            margin: 5px 0 6px 0;
            font-size: 1.6rem;
            width: 100%;
            line-height: 1.3;
        }
        .daily-quote {
            text-align: center;
            font-size: 0.9rem;
            color: #7f8c8d;
            font-style: italic;
            margin-bottom: 20px;
            padding: 0 10px;
            font-weight: 500;
        }

        /* 簽到主頁面板 */
        .home-panel {
            background: var(--card-bg); padding: 16px; border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06); margin-bottom: 20px;
            border-top: 6px solid var(--secondary-color); text-align: center;
        }

        .welcome-title { font-size: 1.25rem; font-weight: bold; color: #2c3e50; margin-top: 0; margin-bottom: 8px; }
        .today-status-badge { display: inline-block; padding: 6px 16px; border-radius: 20px; color: white; font-weight: bold; font-size: 1.05rem; margin-bottom: 15px; }
        .status-strength { background-color: var(--accent-color); }
        .status-cardio { background-color: var(--purple-color); }
        .status-rest { background-color: var(--primary-color); }
        .status-makeup { background-color: #f1c40f; color: #333; }
        .today-desc { font-size: 0.95rem; color: #555; background: #f9f9f9; padding: 12px; border-radius: 8px; border-left: 4px solid #ddd; margin-bottom: 16px; text-align: left; }

        .btn-main-action {
            background-color: #2c3e50; color: white; border: none; padding: 12px 25px; font-size: 1.15rem; font-weight: bold; border-radius: 25px; cursor: pointer; margin-bottom: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); transition: all 0.2s; display: none; width: 100%; max-width: 320px;
        }

        .checkin-section { display: flex; align-items: center; justify-content: space-between; background: #edf7ed; padding: 12px; border-radius: 8px; margin-bottom: 15px; text-align: left; gap: 8px; flex-wrap: wrap; }
        .btn-checkin { background-color: var(--primary-color); color: white; border: none; padding: 10px 16px; font-size: 0.95rem; font-weight: bold; border-radius: 6px; cursor: pointer; flex-shrink: 0; }
        .btn-checkin:disabled { background-color: #bbb; cursor: not-allowed; }
        .btn-use-pass { background-color: #8e44ad; color: white; border: none; padding: 8px 12px; font-size: 0.85rem; font-weight: bold; border-radius: 6px; cursor: pointer; }

        .missed-checkbox-area { font-size: 0.85rem; color: var(--text-color); display: flex; flex-direction: column; align-items: flex-start; gap: 10px; background: #fff0f0; padding: 12px; border-radius: 8px; border: 1px dashed var(--danger-color); }
        .checkbox-item { display: flex; align-items: flex-start; gap: 8px; cursor: pointer; text-align: left; width: 100%; }
        .checkbox-item input { margin-top: 3px; flex-shrink: 0; }

        /* 訓練計時器控制面板 */
        .control-panel { background: var(--card-bg); padding: 20px 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); text-align: center; margin-bottom: 25px; }
        
        .main-btn-row {
            display: flex; gap: 10px; justify-content: center; width: 100%; margin-bottom: 12px;
        }
        .btn-start { background-color: var(--primary-color); color: white; border: none; padding: 14px 0; font-size: 1.2rem; font-weight: bold; border-radius: 30px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 48%; max-width: 140px; }
        .btn-start.stop-mode { background-color: var(--danger-color); }
        
        .btn-pause { background-color: var(--warning-color); color: #333; border: none; padding: 14px 0; font-size: 1.2rem; font-weight: bold; border-radius: 30px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 48%; max-width: 140px; display: none; }
        .btn-pause.resume-mode { background-color: #27ae60; color: white; }

        .step-adjust-group {
            display: none; gap: 12px; justify-content: center; margin-top: 5px; margin-bottom: 12px;
        }
        .btn-step-adjust {
            background-color: #ffffff; color: #34495e; border: 2px solid #bdc3c7; padding: 6px 16px; font-size: 0.85rem; font-weight: bold; border-radius: 8px; cursor: pointer; transition: all 0.1s;
        }
        .btn-step-adjust:active { background-color: #f2f4f4; transform: scale(0.96); }

        .btn-skip { background-color: #7f8c8d; color: white; border: none; padding: 8px 20px; font-size: 0.9rem; border-radius: 15px; cursor: pointer; margin-bottom: 12px; display: none; width: 100%; max-width: 160px; }
        .btn-counter { background-color: var(--purple-color); color: white; border: none; padding: 18px 20px; font-size: 1.25rem; font-weight: bold; border-radius: 12px; cursor: pointer; margin: 10px 0; display: none; width: 100%; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }

        .music-controls-group {
            display: none; gap: 8px; justify-content: center; margin-top: 15px; padding-top: 12px; border-top: 1px dashed #e5e7eb; width: 100%;
        }
        .btn-music-action {
            background-color: #f3f4f6; color: #4b5563; border: 1px solid #d1d5db; padding: 6px 14px; font-size: 0.85rem; font-weight: bold; border-radius: 20px; cursor: pointer;
        }
        .btn-music-action:active { background-color: #e5e7eb; }

        .status-display { margin-top: 15px; }
        .current-round { font-size: 1.1rem; color: #7f8c8d; font-weight: bold; }
        .current-task { font-size: 1.5rem; color: #2c3e50; font-weight: bold; margin: 8px 0; padding: 0 5px; }
        .timer-countdown { font-size: 3.5rem; font-weight: bold; color: var(--accent-color); margin: 5px 0; transition: color 0.2s ease; word-break: break-all; }

        /* 課表清單樣式 */
        .workout-section-title { font-size: 1.2rem; font-weight: bold; color: #2c3e50; margin-bottom: 10px; display: flex; align-items: center; gap: 5px; width: 100%; }
        .workout-list { list-style: none; padding: 0; margin: 0; opacity: 0.8; width: 100%; }
        .workout-item { background: var(--card-bg); border-left: 5px solid #bdc3c7; margin-bottom: 12px; padding: 15px; border-radius: 0 8px 8px 0; box-shadow: 0 2px 5px rgba(0,0,0,0.04); text-align: left; }
        .workout-item.active { border-left-color: var(--accent-color) !important; background: #fff3cd !important; transform: scale(1.01); box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
        .workout-item.active-rest { border-left-color: var(--secondary-color) !important; background: #eef7ff !important; }
        .workout-title { font-size: 1.1rem; font-weight: bold; margin: 0 0 5px 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
        .workout-count { color: #e67e22; flex-shrink: 0; font-size: 1rem; }
        .rest-item .workout-count { color: var(--secondary-color); }
        .workout-desc { font-size: 0.85rem; color: #7f8c8d; margin: 5px 0 0 0; }

        /* 隱藏 YouTube 播放器 */
        #yt-player-container {
            position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); border: 0;
        }

        /* 彈窗通用樣式 */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.5); display: none; justify-content: center;
            align-items: center; z-index: 100; padding: 10px;
        }
        .modal-card {
            background: #ffffff; width: 100%; max-width: 520px; border-radius: 16px;
            padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); max-height: 90vh;
            display: flex; flex-direction: column;
        }
        .modal-header {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;
        }
        .modal-header-title { font-size: 1.25rem; font-weight: bold; color: #2c3e50; }
        .close-modal-btn {
            background: none; border: none; font-size: 1.5rem; color: #888; cursor: pointer; padding: 0 5px;
        }

        /* 月曆專屬樣式 */
        .calendar-selectors { display: flex; gap: 8px; }
        .calendar-selectors select {
            padding: 6px 8px; border-radius: 8px; border: 1px solid #ccc; font-weight: bold; font-size: 0.9rem;
        }
        .calendar-grid-header {
            display: grid; grid-template-columns: repeat(7, 1fr); text-align: center;
            font-weight: bold; font-size: 0.85rem; color: #7f8c8d; margin-bottom: 8px;
        }
        .calendar-days-container {
            display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px;
            overflow-y: auto; padding: 2px;
        }
        .day-cell {
            background: #fdfdfd; border: 1px solid #e0e0e0; border-radius: 8px;
            padding: 6px 2px; min-height: 62px; display: flex; flex-direction: column;
            align-items: center; justify-content: space-between; font-size: 0.75rem; text-align: center;
        }
        .day-cell.empty { background: transparent; border: none; }
        .day-num { font-weight: bold; font-size: 0.85rem; }
        .day-workout { font-size: 0.65rem; color: #555; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
        .day-badge {
            font-size: 0.65rem; padding: 2px 4px; border-radius: 4px; font-weight: bold; margin-top: 2px;
        }
        .badge-checked { background: #d4edda; color: #155724; }
        .badge-missed { background: #f8d7da; color: #721c24; cursor: pointer; text-decoration: underline; }
        .badge-needcheck { background: #fff3cd; color: #856404; cursor: pointer; font-weight: 900; }
        .badge-rest { background: #e2e3e5; color: #383d41; }
        .day-cell.clickable { cursor: pointer; transition: transform 0.1s; }
        .day-cell.clickable:active { transform: scale(0.95); background-color: #fff9e6; }

        /* 任務系統樣式 */
        .task-tabs {
            display: flex; gap: 8px; border-bottom: 2px solid #eee; margin-bottom: 12px;
        }
        .task-tab-btn {
            background: none; border: none; padding: 8px 12px; font-weight: bold; font-size: 0.95rem;
            color: #7f8c8d; cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px;
        }
        .task-tab-btn.active {
            color: var(--secondary-color); border-bottom-color: var(--secondary-color);
        }
        .task-list-container {
            overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 2px;
        }
        .task-card {
            background: #fdfdfd; border: 1px solid #e0e0e0; border-radius: 10px;
            padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px;
        }
        .task-info { display: flex; flex-direction: column; text-align: left; }
        .task-title { font-weight: bold; font-size: 0.92rem; color: #2c3e50; }
        .task-reward { font-size: 0.78rem; color: #e67e22; font-weight: 600; }
        .task-right-col { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
        .task-progress { font-size: 0.95rem; font-weight: 900; color: #2980b9; }
        .btn-claim-task {
            background-color: var(--primary-color); color: white; border: none; padding: 5px 12px;
            border-radius: 6px; font-size: 0.8rem; font-weight: bold; cursor: pointer;
        }
        .btn-claim-task:disabled { background-color: #bdc3c7; cursor: not-allowed; }
        .reward-shop-area {
            background: #fff8eb; border: 1px dashed #f39c12; border-radius: 10px; padding: 12px;
            margin-top: 10px; text-align: left; display: flex; justify-content: space-between; align-items: center;
        }

        @media (min-width: 600px) {
            body { padding: 24px; }
            h1.main-title { font-size: 2rem; margin-top: 8px; margin-bottom: 8px; }
            .top-btn { font-size: 0.9rem; padding: 6px 14px; }
            .daily-quote { font-size: 1.05rem; margin-bottom: 25px; }
            .home-panel { padding: 28px; }
            .welcome-title { font-size: 1.5rem; }
            .today-desc { font-size: 1.05rem; padding: 15px; }
            .missed-checkbox-area { font-size: 0.95rem; padding: 16px; }
            .timer-countdown { font-size: 5rem; margin: 10px 0; }
            .current-task { font-size: 1.8rem; }
            .workout-title { font-size: 1.2rem; }
            .workout-count { font-size: 1.1rem; }
            .workout-desc { font-size: 0.9rem; }
            .workout-item { padding: 18px 20px; }
            .day-cell { min-height: 75px; padding: 8px 4px; }
            .day-workout { font-size: 0.75rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 頂部獨立列：按鈕群靠右對齊，不干擾主標題 -->
        <div class="top-navbar">
            <div class="top-action-bar">
                <button class="top-btn" onclick="openCalendarModal()">📅 簽到月曆</button>
                <button class="top-btn task-btn" onclick="openTaskModal()">🎯 任務清單</button>
            </div>
        </div>

        <!-- 主標題居中獨立行 -->
        <h1 class="main-title">🥇 謝佳杰的裁判養成之路</h1>
        <div id="daily-quote-text" class="daily-quote">載入今日激勵語錄中...</div>

        <!-- 主頁：簽到與今日課表狀態 -->
        <div class="home-panel">
            <div class="welcome-title" id="welcome-date">今天是星期幾</div>
            <div id="today-badge" class="today-status-badge">載入中...</div>
            <div id="today-desc" class="today-desc">課表內容加載中...</div>

            <center>
                <button id="main-action-btn" class="btn-main-action" onclick="scrollToWorkoutPanel()">進入今日訓練菜單 ➔</button>
            </center>

            <div class="checkin-section">
                <div>
                    <span id="checkin-status-text" style="font-size:0.95rem; font-weight:bold;">今日尚未簽到 📝</span>
                    <span id="reward-tickets-text" style="font-size:0.8rem; color:#8e44ad; display:block; margin-top:2px;">🎟 免訓券庫存: 0 張</span>
                </div>
                <div style="display:flex; gap:6px; align-items:center;">
                    <button id="use-pass-btn" class="btn-use-pass" style="display:none;" onclick="useRestTicket()">使用免訓券 🏖️</button>
                    <button id="checkin-btn" class="btn-checkin" onclick="clickCheckIn()">每日簽到</button>
                </div>
            </div>

            <div class="missed-checkbox-area">
                <span style="font-weight: bold; color: var(--danger-color); margin-bottom: 2px;">🛠 模擬補簽測試面板 (勾選立刻覆蓋，取消即還原)：</span>
                <label class="checkbox-item">
                    <input type="checkbox" id="mock-strength-cb" onchange="selectMockMode('strength')">
                    <span>勾選模擬「之前有漏掉簽到」<br><small style="color:#666;">（測試核心肌力日補訓用）</small></span>
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" id="mock-cardio-cb" onchange="selectMockMode('cardio')">
                    <span>勾選模擬「之前有漏掉簽到」<br><small style="color:#666;">（測試體能爆汗日補訓用）</small></span>
                </label>
            </div>
        </div>

        <!-- 動態訓練計時控制台主區段 -->
        <div id="timer-container-section" style="display: none;">
            <div class="workout-section-title" id="panel-title-text">⏱ 訓練控制台</div>
            
            <div class="control-panel">
                <div class="main-btn-row">
                    <button id="start-btn" class="btn-start" onclick="toggleWorkout()">開始練習 🚀</button>
                    <button id="pause-btn" class="btn-pause" onclick="togglePauseWorkout()">暫停訓練 ⏸️</button>
                </div>

                <div id="step-adjust-box" class="step-adjust-group">
                    <button class="btn-step-adjust" onclick="navigateStep(-1)">⏮️ 上一個動作</button>
                    <button class="btn-step-adjust" onclick="navigateStep(1)">下一個動作 ⏭️</button>
                </div>

                <center>
                    <button id="skip-btn" class="btn-skip" onclick="skipRest()">跳過休息 ⏩</button>
                    <button id="counter-btn" class="btn-counter" onclick="incrementLaps()">折返跑完成 (目前：0 / 6 趟) 🏃‍♂️</button>
                </center>
                
                <div id="status-area" class="status-display">
                    <div id="round-text" class="current-round">第 1 組</div>
                    <div id="task-text" class="current-task">準備倒數</div>
                    <div id="countdown-text" class="timer-countdown">3</div>
                </div>

                <div id="music-ctrl-box" class="music-controls-group">
                    <button class="btn-music-action" onclick="seekMusicPlaylist(5)">+5s ⏩</button>
                    <button id="play-pause-music-btn" class="btn-music-action" onclick="toggleMusicPlayback()">暫停音樂 ⏸️</button>
                    <button class="btn-music-action" onclick="nextTrackPlaylist()">跳過此歌 ⏭️</button>
                </div>
            </div>

            <div class="workout-section-title">📋 當前循環動作清單</div>
            <ul class="workout-list" id="workout-container-list"></ul>
        </div>
    </div>

    <!-- 簽到與訓練歷史月曆彈窗 -->
    <div id="calendar-modal" class="modal-overlay" onclick="closeCalendarModal(event)">
        <div class="modal-card" onclick="event.stopPropagation()">
            <div class="modal-header">
                <div class="modal-header-title">📅 簽到紀錄月曆</div>
                <div class="calendar-selectors">
                    <select id="cal-year-select" onchange="updateCalendarView()"></select>
                    <select id="cal-month-select" onchange="updateCalendarView()"></select>
                </div>
                <button class="close-modal-btn" onclick="toggleCalendarModal(false)">✖</button>
            </div>
            <div class="calendar-grid-header">
                <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
            </div>
            <div id="calendar-days" class="calendar-days-container"></div>
        </div>
    </div>

    <!-- 任務清單與成就彈窗 -->
    <div id="task-modal" class="modal-overlay" onclick="closeTaskModal(event)">
        <div class="modal-card" onclick="event.stopPropagation()">
            <div class="modal-header">
                <div class="modal-header-title">🎯 裁判養成任務中心</div>
                <button class="close-modal-btn" onclick="toggleTaskModal(false)">✖</button>
            </div>
            
            <div class="task-tabs">
                <button id="tab-daily-btn" class="task-tab-btn active" onclick="switchTaskTab('daily')">📅 每日任務</button>
                <button id="tab-total-btn" class="task-tab-btn" onclick="switchTaskTab('total')">🏆 總成就清單</button>
            </div>

            <div id="task-list-box" class="task-list-container"></div>

            <div class="reward-shop-area">
                <div>
                    <div style="font-weight: bold; color: #d35400; font-size: 0.9rem;">🎁 獎勵兌換所</div>
                    <div id="star-points-text" style="font-size: 0.8rem; color: #555;">持有榮譽點數：0 ⭐｜免訓券：0 張</div>
                </div>
                <button class="btn-claim-task" onclick="exchangeRestTicket()">兌換免訓券 (5⭐)</button>
            </div>
        </div>
    </div>

    <div id="yt-player-container"><div id="yt-api-player"></div></div>

    <script>
        /* ==================== 1. 防雙擊放大 & 鎖定螢幕與方向 ==================== */
        let lastTouchEnd = 0;
        document.addEventListener('touchend', function (event) {
            const now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) {
                event.preventDefault();
            }

        function fadeVideoVolume(targetVolume, durationMs) {
            if (!isPlayerReady || !ytPlayer || typeof ytPlayer.getVolume !== 'function') return;
            const startVolume = ytPlayer.getVolume();
            const volumeDiff = targetVolume - startVolume;
            if (volumeDiff === 0) return;

            const startTime = performance.now();
            function step(timestamp) {
                const elapsed = timestamp - startTime;
                const progress = Math.min(elapsed / durationMs, 1);
                const startBtn = varBtn = Math.round(startVolume + (volumeDiff * progress));
                try { ytPlayer.setVolume(startBtn); } catch(e) {}
                if (progress < 1) window.requestAnimationFrame(step);
            }
            window.requestAnimationFrame(step);
        }

        function calculateCurrentStreak() {
            let streak = 0;
            let checkDate = new Date();
            while (true) {
                const dateStr = getFormattedDate(checkDate);
                const dayOfWeek = checkDate.getDay();
                const schedule = originalSchedule[dayOfWeek];
                if (isDayOfficiallyCompleted(dateStr, schedule)) {
                    streak++;
                    checkDate.setDate(checkDate.getDate() - 1);
                } else {
                    if (dateStr === getFormattedDate(new Date())) {
                        checkDate.setDate(checkDate.getDate() - 1);
                        continue;
                    }
                    break;
                }
            }
            return streak;
        }

            const checkedList = getStoredList('user_checked_dates');

            checkedList.forEach(dStr => {
                const parts = dStr.split('-');
                const d = new Date(parts[0], parts[1] - 1, parts[2]);
                const schedule = originalSchedule[d.getDay()];
                if (isDayOfficiallyCompleted(dStr, schedule)) {
                    count++;
                }
            });
            return count;
        }

        function formatTimeDisplay(totalSeconds) { if (totalSeconds >= 60) { return `${Math.floor(totalSeconds / 60)}分${totalSeconds % 60}秒`; } return `${totalSeconds}s`; }

        /* ==================== 6. 月曆視圖與歷史紀錄引擎 ==================== */
        function initCalendarSelectors() {
            const yearSelect = document.getElementById('cal-year-select');
            const monthSelect = document.getElementById('cal-month-select');
            const currentYear = new Date().getFullYear();
            const currentMonth = new Date().getMonth();

            yearSelect.innerHTML = "";
            for (let y = currentYear - 2; y <= currentYear + 2; y++) {
                const opt = document.createElement('option');
                opt.value = y; opt.textContent = `${y} 年`;
                if (y === currentYear) opt.selected = true;
                yearSelect.appendChild(opt);
            }

            monthSelect.innerHTML = "";
            for (let m = 0; m < 12; m++) {
                const opt = document.createElement('option');
                opt.value = m; opt.textContent = `${m + 1} 月`;
                if (m === currentMonth) opt.selected = true;
                monthSelect.appendChild(opt);
            }
        }

        function openCalendarModal() {
            toggleCalendarModal(true);
            updateCalendarView();
        }

        function toggleCalendarModal(show) {
            document.getElementById('calendar-modal').style.display = show ? 'flex' : 'none';
        }

        function closeCalendarModal(e) {
            if (e.target.id === 'calendar-modal') toggleCalendarModal(false);
        }

        function updateCalendarView() {
            const year = parseInt(document.getElementById('cal-year-select').value);
            const month = parseInt(document.getElementById('cal-month-select').value);
            const daysContainer = document.getElementById('calendar-days');
            daysContainer.innerHTML = "";

            const firstDayIndex = new Date(year, month, 1).getDay();
            const totalDays = new Date(year, month + 1, 0).getDate();
            const todayFormatted = getFormattedDate(new Date());

            for (let i = 0; i < firstDayIndex; i++) {
                const blank = document.createElement('div');
                blank.className = "day-cell empty";
                daysContainer.appendChild(blank);
            }

            for (let day = 1; day <= totalDays; day++) {
                const dateObj = new Date(year, month, day);
                const dateStr = getFormattedDate(dateObj);
                const dayOfWeek = dateObj.getDay();
                const schedule = originalSchedule[dayOfWeek];
                
                const checked = isUserCheckedIn(dateStr);
                const done = isWorkoutDone(dateStr);
                const isFullyCompleted = isDayOfficiallyCompleted(dateStr, schedule);
                const isPastOrToday = (dateStr <= todayFormatted);

                const cell = document.createElement('div');
                cell.className = "day-cell";

                let badgeHtml = "";
                let shortWorkout = schedule.name.split(' ')[0];

                if (isFullyCompleted) {
                    badgeHtml = `<span class="day-badge badge-checked">已簽到 ✅</span>`;
                } else if (!isPastOrToday) {
                    badgeHtml = `<span class="day-badge badge-rest">未到期</span>`;
                } else if (!schedule.hasTimer) {
                    badgeHtml = `<span class="day-badge badge-missed">未簽到 ⭕</span>`;
                    cell.classList.add('clickable');
                    cell.title = "休息日未簽到，點擊即可直接補簽！";
                    cell.onclick = () => {
                        addToList('user_checked_dates', dateStr);
                        alert(`【${dateStr}】休息日已成功為您補簽！太棒了！🎉`);
                        updateCalendarView();
                        renderSystemPage();
                    };
                } else if (done && !checked) {
                    badgeHtml = `<span class="day-badge badge-needcheck">待補點 📝</span>`;
                    cell.classList.add('clickable');
                    cell.title = "您已完成該日訓練，點擊即可直接補點簽到！";
                    cell.onclick = () => {
                        addToList('user_checked_dates', dateStr);
                        alert(`【${dateStr}】已為您自動補上簽到！太棒了！🎉`);
                        updateCalendarView();
                        renderSystemPage();
                    };
                } else {
                    badgeHtml = `<span class="day-badge badge-missed">未簽到 ⭕</span>`;
                    cell.classList.add('clickable');
                    cell.title = "點擊立刻進入這天的課表補訓！";
                    cell.onclick = () => {
                        selectDayForMakeup(dateStr, schedule);
                    };
                }

                cell.innerHTML = `
                    <div class="day-num" style="${dateStr === todayFormatted ? 'color:var(--accent-color);font-weight:900;' : ''}">${day}</div>
                    <div class="day-workout">${shortWorkout}</div>
                    ${badgeHtml}
                `;
                daysContainer.appendChild(cell);
            }
        }

        function selectDayForMakeup(dateStr, schedule) {
            toggleCalendarModal(false);
            if (isRunning) resetWorkout();
            makeupTargetDateStr = dateStr;
            renderSystemPage();
            setTimeout(() => {
                scrollToWorkoutPanel();
            }, 200);
        }

        /* ==================== ⏱️ 計時訓練控制核心引擎 ==================== */
        function toggleWorkout() {
            if (!isRunning) {
                isRunning = true;
                isPaused = false;
                startBtn.textContent = "完全結束 ⏹️";
                startBtn.classList.add('stop-mode');
                
                pauseBtn.style.display = 'inline-block';
                pauseBtn.textContent = "暫停訓練 ⏸️";
                pauseBtn.classList.remove('resume-mode');
                stepAdjustBox.style.display = 'flex';
                musicCtrlBox.style.display = 'flex';
                
                playMusicPlaylist();
                initWorkout();
            } else {
                resetWorkout();
            }
        }

        function resetWorkout() {
            clearInterval(countdownInterval);
            isRunning = false;
            isPaused = false;
            currentRound = 1;
            currentStepIndex = 0;
            currentLaps = 0;
            
            startBtn.textContent = "開始練習 🚀";
            startBtn.classList.remove('stop-mode');
            
            pauseBtn.style.display = 'none';
            stepAdjustBox.style.display = 'none';
            musicCtrlBox.style.display = 'none';
            statusArea.style.display = 'none';
            skipBtn.style.display = 'none';
            counterBtn.style.display = 'none';
            
            clearAllHighlights();
            countdownText.onclick = null;
            countdownText.style.cursor = "default";
            stopMusicPlaylist();
        }

        function togglePauseWorkout() {
            if (!isRunning) return;

            if (!isPaused) {
                isPaused = true;
                clearInterval(countdownInterval);
                pauseBtn.textContent = "恢復訓練 ▶️";
                pauseBtn.classList.add('resume-mode');
                
                if (isMusicPlaying) {
                    fadeVideoVolume(0, 200);
                    setTimeout(() => { ytPlayer.pauseVideo(); }, 200);
                }
                playSound(440, 0.08);
                countdownText.style.opacity = "0.6";
            } else {
                isPaused = true; 
                pauseBtn.textContent = "暫停訓練 ⏸️";
                pauseBtn.classList.remove('resume-mode');
                countdownText.style.opacity = "1";
                
                if (isMusicPlaying) ytPlayer.playVideo();

                if (currentStepType === "timer") {
                    resumeTimerEngine();
                } else {
                    isPaused = false;
                }
                playSound(600, 0.05);
            }
        }

        function initWorkout() {
            statusArea.style.display = 'block';
            currentRound = 1;
            currentStepIndex = 0;
            currentLaps = 0;
            clearAllHighlights();
            
            if (isMusicPlaying) fadeVideoVolume(DUCKED_VOLUME, 150);
            runPreparation(3, () => { executeStep(); });
        }

        function runPreparation(seconds, callback) {
            currentStepType = "prep";
            taskText.textContent = "準備倒數";
            skipBtn.style.display = 'none';
            counterBtn.style.display = 'none';
            countdownText.style.color = "var(--accent-color)";
            countdownText.textContent = seconds;
            playSound(440, 0.1);

            let sec = seconds;
            countdownInterval = setInterval(() => {
                if (isPaused) return;
                sec--;
                if (sec > 0) {
                    countdownText.textContent = sec;
                    playSound(440, 0.1);
                } else if (sec === 0) {
                    countdownText.textContent = "開始！";
                    playSound(880, 0.3);
                } else {
                    clearInterval(countdownInterval);
                    callback();
                }
            }, 1000);
        }

        function executeStep() {
            if (currentRound > activeWorkout.maxRounds) { endWorkout(); return; }
            const step = activeWorkout.activeConfig[currentStepIndex];
            if (currentRound === activeWorkout.maxRounds && step.isFinalRest) { endWorkout(); return; }

            isPaused = false;
            roundText.textContent = `第 ${currentRound} / ${activeWorkout.maxRounds} 組`;
            taskText.textContent = step.name;
            highlightItem(step.id);
            skipBtn.style.display = (step.isRestStep) ? 'inline-block' : 'none';
            
            if (step.type === "lapCounter") {
                currentStepType = "lapCounter";
                counterBtn.style.display = 'inline-block';
                currentLaps = 0;
                counterBtn.textContent = `折返跑完成 (目前：${currentLaps} / 6 趟) 🏃‍♂️`;
                countdownText.style.color = "var(--purple-color)";
                countdownText.textContent = "RUN!";
                if (isMusicPlaying) fadeVideoVolume(NORMAL_VOLUME, 300); 
                return;
            } else {
                counterBtn.style.display = 'none';
            }

            if (step.type === "timer") {
                currentStepType = "timer";
                timeLeft = step.duration;
                if (timeLeft <= 5) {
                    if (isMusicPlaying) fadeVideoVolume(DUCKED_VOLUME, 150);
                    countdownText.style.color = "var(--danger-color)";
                } else {
                    if (isMusicPlaying) fadeVideoVolume(NORMAL_VOLUME, 300);
                    countdownText.style.color = "var(--accent-color)";
                }
                countdownText.textContent = formatTimeDisplay(timeLeft);
                resumeTimerEngine();
            } else if (step.type === "count") {
                currentStepType = "count";
                if (isMusicPlaying) fadeVideoVolume(NORMAL_VOLUME, 300);
                countdownText.style.color = "var(--secondary-color)";
                countdownText.textContent = "DONE ➔";
                countdownText.style.cursor = "pointer";
                countdownText.onclick = function() {
                    if (isPaused) return;
                    countdownText.onclick = null;
                    countdownText.style.cursor = "default";
                    countdownText.style.color = "var(--danger-color)";
                    if (isMusicPlaying) fadeVideoVolume(DUCKED_VOLUME, 150);
                    
                    if (activeWorkout.title.includes("體能爆汗")) {
                        countdownText.textContent = "開始下一個動作";
                    } else {
                        countdownText.textContent = "開始休息";
                    }
                    setTimeout(() => { nextStep(); }, 1000);
                };
            }
        }

        function resumeTimerEngine() {
            isPaused = false;
            clearInterval(countdownInterval);
            countdownInterval = setInterval(() => {
                if (isPaused) return; 
                timeLeft--;
                if (timeLeft > 0) {
                    countdownText.textContent = formatTimeDisplay(timeLeft);
                    if (timeLeft <= 5) {
                        countdownText.style.color = "var(--danger-color)";
                        if (timeLeft === 5 && isMusicPlaying) fadeVideoVolume(DUCKED_VOLUME, 300);
                        playSound(550, 0.1);
                    }
                } else {
                    clearInterval(countdownInterval);
                    playSound(880, 0.4);
                    countdownText.style.color = "var(--danger-color)";
                    
                    const step = activeWorkout.activeConfig[currentStepIndex];
                    if (step.exerciseAfter) countdownText.textContent = "開始休息";
                    else if (step.restAfter) countdownText.textContent = "開始訓練";
                    else countdownText.textContent = "開始下一個動作";
                    
                    setTimeout(() => { nextStep(); }, 1000);
                }
            }, 1000);
        }

        function navigateStep(direction) {
            if (!isRunning) return;
            clearInterval(countdownInterval); 
            countdownText.onclick = null;
            countdownText.style.cursor = "default";
            countdownText.style.opacity = "1";

            currentStepIndex += direction;

            if (currentStepIndex < 0) {
                if (currentRound > 1) {
                    currentRound--;
                    currentStepIndex = activeWorkout.activeConfig.length - 1;
                } else {
                    currentStepIndex = 0; 
                }
            } 
            else if (currentStepIndex >= activeWorkout.activeConfig.length) {
                currentStepIndex = 0;
                currentRound++;
            }

            playSound(523.25, 0.05); 
            executeStep(); 
        }

        function incrementLaps() {
            if (isPaused || activeWorkout.activeConfig[currentStepIndex].type !== "lapCounter") return;
            currentLaps++; playSound(587.33, 0.1);
            if (currentLaps >= 6) {
                counterBtn.style.display = 'none'; playSound(880, 0.4);
                if (isMusicPlaying) fadeVideoVolume(DUCKED_VOLUME, 150); 
                countdownText.style.color = "var(--danger-color)"; countdownText.textContent = "開始下一個動作";
                setTimeout(() => { nextStep(); }, 1000);
            } else { counterBtn.textContent = `折返跑完成 (目前：${currentLaps} / 6 趟) 🏃‍♂️`; }
        }

        function skipRest() {
            if (isPaused) return;
            clearInterval(countdownInterval); skipBtn.style.display = 'none'; playSound(880, 0.4);
            if (isMusicPlaying) fadeVideoVolume(DUCKED_VOLUME, 150); 
            countdownText.style.color = "var(--danger-color)"; countdownText.textContent = "開始訓練";
            setTimeout(() => { nextStep(); }, 1000);
        }

        function nextStep() {
            clearInterval(countdownInterval); currentStepIndex++;
            if (currentStepIndex >= activeWorkout.activeConfig.length) {
                currentStepIndex = 0; currentRound++;
                if (currentRound <= activeWorkout.maxRounds) {
                    clearAllHighlights(); fadeVideoVolume(DUCKED_VOLUME, 150);
                    runPreparation(3, () => { executeStep(); }); return;
                }
            }
            executeStep();
        }

        function endWorkout() {
            clearInterval(countdownInterval); clearAllHighlights(); isRunning = false;
            
            if (makeupTargetDateStr) {
                addToList('workout_done_dates', makeupTargetDateStr);
                addToList('user_checked_dates', makeupTargetDateStr); 
                
                const doneDate = makeupTargetDateStr;
                makeupTargetDateStr = null; 
                resetWorkout();             
                renderSystemPage();         
                
                alert(`太棒了！已確實完成補訓，【${doneDate}】已正式簽到成功！💪\n已為您切換回今天的課表！`);
            } else {
                const todayFormatted = getFormattedDate(new Date());
                addToList('workout_done_dates', todayFormatted);
                
                startBtn.textContent = "再練一次 💪"; startBtn.classList.remove('stop-mode');
                pauseBtn.style.display = 'none';
                stepAdjustBox.style.display = 'none';
                skipBtn.style.display = 'none'; 
                counterBtn.style.display = 'none'; 
                musicCtrlBox.style.display = 'none';
                
                roundText.textContent = `第 ${activeWorkout.maxRounds} / ${activeWorkout.maxRounds} 組`;
                taskText.textContent = "🎉 恭喜完成今日完整訓練！卓越紀律！";
                countdownText.style.color = "var(--primary-color)"; countdownText.textContent = "🏆";
                countdownText.style.opacity = "1";
                stopMusicPlaylist(); 

                if (isUserCheckedIn(todayFormatted)) {
                    alert("今日簽到與訓練皆已完成！太棒了！🏆");
                } else {
                    alert("今日訓練已完成！記得點擊上方「補點簽到」完成簽到紀錄喔！📝");
                }
                renderSystemPage();
            }

            setTimeout(() => playSound(523.25, 0.15), 0);
            setTimeout(() => playSound(659.25, 0.15), 150);
            setTimeout(() => playSound(783.99, 0.3), 300);
        }

        function highlightItem(id) {
            clearAllHighlights();
            const el = document.getElementById(`item-${id}`);
            if (el) { el.classList.add('active'); if (activeWorkout.activeConfig[id].isRestStep) el.classList.add('active-rest'); }
        }

        function clearAllHighlights() {
            for (let i = 0; i < 10; i++) {
                const el = document.getElementById(`item-${i}`);
                if (el) {
                    el.className = "workout-item";
                    if (activeWorkout && activeWorkout.activeConfig[i] && activeWorkout.activeConfig[i].isRestStep) el.className += " rest-item";
                    else if (activeWorkout && !activeWorkout.title.includes("體能爆汗") && (i === 1 || i === 3 || i === 5 || i === 7 || i === 9)) el.className += " rest-item";
                }
            }
        }

        function playSound(frequency, duration) {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator(); const gainNode = audioCtx.createGain();
                oscillator.type = 'sine'; oscillator.frequency.setValueAtTime(frequency, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime); oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination); oscillator.start(); oscillator.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }
    </script>
</body>
</html>
